[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radicalmap"
version = "2.0.0"
description = "Academic research instrument for mapping extremist content networks"
requires-python = ">=3.11"
# Compatible ranges here so the package resolves on every supported Python;
# requirements.txt is the exact, tested lock for reproducing a run.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2026.1.1",
  "playwright>=1.45,<2",
  "browser-cookie3>=0.20,<1",
  "anthropic>=0.40,<1",
  "numpy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
radicalmap = "radicalmap.cli:main"

# The repo is a flat layout holding v1 (scraper/, analysis/, frontend/, db/)
# next to v2, so setuptools cannot auto-discover. Only v2 is the package.
# PROJECT_ROOT-relative paths (db/, data/) assume an editable install from a
# checkout, which is the supported way to run this.
[tool.setuptools.packages.find]
include = ["radicalmap*"]

[tool.setuptools.package-data]
radicalmap = ["db/schema/*.sql", "classify/prompts/*.md", "web/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep linting focused on correctness bugs; avoid mass style churn.
select = ["E9", "F63", "F7", "F82"]
