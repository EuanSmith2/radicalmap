[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radicalmap"
version = "2.0.0"
description = "Academic research instrument for mapping extremist content networks"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
  "yt-dlp==2026.7.4",
  "playwright==1.61.0",
  "browser-cookie3==0.20.1",
  "anthropic==0.116.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
radicalmap = "radicalmap.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep linting focused on correctness bugs; avoid mass style churn.
select = ["E9", "F63", "F7", "F82"]
